<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hector Luis Tirado Jr | REALTOR®</title>
    <script>
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var vcardUrl = "https://not2nerdy.github.io/Contact/hector.vcf";

            // iPhone / iOS: Instant redirect to native overlay
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(vcardUrl);
            } 
            // Android: Auto-download the vCard & show on-screen instruction
            else if (/android/i.test(userAgent)) {
                var link = document.createElement('a');
                link.href = vcardUrl;
                link.setAttribute('download', 'hector.vcf');
                document.body.appendChild(link);
                link.click();
            } 
            // Desktop fallback
            else {
                window.location.replace("https://www.movetospacecoast.com");
            }
        };
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            color: #0f172a;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 320px;
            width: 85%;
        }
        h2 { margin: 0 0 4px 0; font-size: 1.25rem; font-weight: 700; }
        .title { color: #0284c7; font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
        .org { color: #64748b; font-size: 0.85rem; margin-bottom: 18px; }
        .alert-box {
            background-color: #e0f2fe;
            border: 1px solid #bae6fd;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #0369a1;
            margin-bottom: 18px;
            line-height: 1.4;
        }
        .btn {
            display: block;
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Hector Luis Tirado Jr</h2>
        <div class="title">REALTOR®</div>
        <div class="org">Relentless Real Estate</div>

        <div class="alert-box">
            📲 <strong>Tap "Open" or the download banner</strong> at the top/bottom of your screen to save to Google Contacts.
        </div>

        <a href="https://not2nerdy.github.io/Contact/hector.vcf" class="btn" download="hector.vcf">Download Contact File (.vcf)</a>
    </div>
</body>
</html>
