<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hector Luis Tirado Jr | REALTOR®</title>
    <script>
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var vcardUrl = "https://not2nerdy.github.io/Contact/hector.vcf";

            // iPhone / iOS: Instant redirect to trigger native Contact overlay
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(vcardUrl);
            } 
            // Android: Trigger file download for import prompt
            else if (/android/i.test(userAgent)) {
                var link = document.createElement('a');
                link.href = vcardUrl;
                link.setAttribute('download', 'hector.vcf');
                document.body.appendChild(link);
                link.click();
            } 
            // Fallback for Desktop
            else {
                window.location.replace("https://www.movetospacecoast.com");
            }
        };
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { margin: 0 0 6px 0; font-size: 1.35rem; font-weight: 700; color: #ffffff; }
        .title { color: #38bdf8; font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
        .org { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
        .btn {
            display: block;
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Hector Luis Tirado Jr</h2>
        <div class="title">REALTOR®</div>
        <div class="org">Relentless Real Estate</div>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 15px;">Saving contact file...</p>
        <a href="https://not2nerdy.github.io/Contact/hector.vcf" class="btn" download="hector.vcf">Download Contact (.vcf)</a>
    </div>
</body>
</html>
