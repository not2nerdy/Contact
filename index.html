<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hector Luis Tirado Jr | REALTOR®</title>
    <script>
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // iPhone / iOS Route
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace("https://not2nerdy.github.io/Contact/hector.vcf");
            } 
            // Android Route (Triggers dedicated Android vCard)
            else if (/android/i.test(userAgent)) {
                window.location.replace("https://not2nerdy.github.io/Contact/android.vcf");
            } 
            // Fallback for Desktop
            else {
                window.location.replace("https://www.movetospacecoast.com");
            }
        };
    </script>
</head>
<body>
    <p>Connecting to contacts...</p>
</body>
</html>
