<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hector Luis Tirado Jr | REALTOR®</title>
    <script>
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var vcardUrl = "https://not2nerdy.github.io/Contact/hector.vcf";

            // iPhone / iOS: Instant redirect to native Contact overlay
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(vcardUrl);
            }
            // Android / Desktop: Show the clean digital card landing page below
        };
    </script>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 32px 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }
        h1 {
            font-size: 1.4rem;
            margin: 0 0 6px 0;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .badge {
            display: inline-block;
            background-color: rgba(2, 132, 199, 0.15);
            color: #38bdf8;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
        }
        .org {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-placeholder">HT</div>
        <h1>Hector Luis Tirado Jr</h1>
        <div class="badge">REALTOR®</div>
        <div class="org">Relentless Real Estate</div>

        <div class="actions">
            <!-- Save Contact Button (Triggers user-initiated download tap on Android) -->
            <a href="https://not2nerdy.github.io/Contact/hector.vcf" class="btn btn-primary" download="hector.vcf">
                💾 Save Contact
            </a>

            <!-- Direct Call -->
            <a href="tel:3216166479" class="btn btn-secondary">
                📞 Call (321) 616-6479
            </a>

            <!-- Website Link -->
            <a href="https://www.movetospacecoast.com" target="_blank" class="btn btn-secondary">
                🌐 Visit MoveToSpaceCoast.com
            </a>
        </div>
    </div>

</body>
</html>
