<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hector Luis Tirado Jr | REALTOR®</title>
    <script>
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var vcardUrl = "https://not2nerdy.github.io/Contact/hector.vcf";

            // 1. iPhone / iOS Detection
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(vcardUrl);
            } 
            // 2. Android Detection (Uses Android Intent to bypass download bar)
            else if (/android/i.test(userAgent)) {
                // Direct Android OS Intent to launch Google Contacts viewer directly
                window.location.href = "intent://not2nerdy.github.io/Contact/hector.vcf#Intent;scheme=https;type=text/x-vcard;action=android.intent.action.VIEW;end;";
            } 
            // 3. Fallback for Desktop
            else {
                window.location.replace("https://www.movetospacecoast.com");
            }
        };
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 85%;
        }
        h2 { margin: 0 0 6px 0; font-size: 1.35rem; font-weight: 700; color: #fff; }
        .title { color: #38bdf8; font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
        .org { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
        .btn {
            display: block;
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Hector Luis Tirado Jr</h2>
        <div class="title">REALTOR®</div>
        <div class="org">Relentless Real Estate</div>
        <p style="font-size: 0.85rem; color: #94a3b8;">Opening contacts...</p>
        <a href="intent://not2nerdy.github.io/Contact/hector.vcf#Intent;scheme=https;type=text/x-vcard;action=android.intent.action.VIEW;end;" class="btn">Add to Contacts</a>
    </div>
</body>
</html>
