<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hector Luis Tirado Jr | Contact</title>
    <script>
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var vcardUrl = "https://not2nerdy.github.io/Contact/hector.vcf";

            // iOS / iPhone detection
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(vcardUrl);
            } 
            // Android detection
            else if (/android/i.test(userAgent)) {
                // Auto-trigger direct download for Android to force Contacts app prompt
                var link = document.createElement('a');
                link.href = vcardUrl;
                link.setAttribute('download', 'hector.vcf');
                document.body.appendChild(link);
                link.click();
            } 
            // Fallback for Desktop/PC
            else {
                window.location.replace("https://www.movetospacecoast.com");
            }
        };
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 320px;
        }
        h2 { margin: 0 0 5px 0; font-size: 1.3rem; }
        p { margin: 5px 0 15px 0; color: #666; font-size: 0.95rem; }
        .btn {
            display: inline-block;
            background-color: #007aff;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Hector Luis Tirado Jr</h2>
        <p>REALTOR® | Relentless Real Estate</p>
        <p>Connecting to contacts...</p>
        <a id="dl-btn" href="https://not2nerdy.github.io/Contact/hector.vcf" class="btn" download="hector.vcf">Save Contact</a>
    </div>
</body>
</html>
